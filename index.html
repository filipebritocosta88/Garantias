<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metasboard | Gestão Enterprise de Triagem</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* --- VARIÁVEIS DE DESIGN SYSTEM --- */
        :root {
            --navy-dark: #0f172a;
            --navy-light: #1e293b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #f59e0b;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --white: #ffffff;
            --sidebar-width: 280px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        /* --- RESET GERAL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--navy-light);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR E NAVEGAÇÃO --- */
        aside {
            width: var(--sidebar-width);
            background-color: var(--navy-dark);
            color: var(--white);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.2);
        }

        .sidebar-header {
            padding: 3rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        .sidebar-header h2 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #f1f5f9;
        }
        
        nav {
            flex-grow: 1;
            padding: 2.5rem 1rem;
        }

        .nav-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 1.2rem;
            margin-bottom: 0.8rem;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
        }

        .nav-btn:hover {
            background-color: #1e293b;
            color: var(--white);
            transform: translateX(10px);
        }

        .nav-btn.active {
            background-color: var(--primary);
            color: var(--white);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
        }

        /* --- ÁREA PRINCIPAL --- */
        main {
            flex-grow: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 3rem;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .tab-content {
            display: none;
            animation: slideInUp 0.6s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- CARDS E ELEMENTOS DE UI --- */
        .card {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 3rem;
            border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        h3 {
            margin-bottom: 2rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--navy-dark);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* --- DASHBOARD E KPIs --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background-color: var(--white);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border-left: 8px solid var(--primary);
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-8px);
        }

        .stat-card.success { border-left-color: var(--success); }
        .stat-card.warning { border-left-color: var(--warning); }
        .stat-card.danger { border-left-color: var(--danger); }

        .stat-card h4 {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        .stat-card p {
            font-size: 2rem;
            font-weight: 800;
            color: var(--navy-dark);
        }

        /* --- FORMULÁRIOS --- */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            padding: 1.1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            background-color: var(--white);
            transition: all 0.3s ease;
            color: var(--navy-dark);
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.15);
        }

        /* --- BOTÕES --- */
        .btn {
            padding: 1.1rem 2rem;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary { background-color: var(--primary); color: var(--white); }
        .btn-primary:hover { 
            background-color: var(--primary-hover); 
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35); 
            transform: translateY(-2px);
        }

        .btn-success { background-color: var(--success); color: var(--white); }
        .btn-danger { background-color: var(--danger); color: var(--white); }
        
        .btn-outline { 
            background-color: var(--white); 
            color: var(--navy-light); 
            border: 2px solid var(--border); 
        }
        .btn-outline:hover { 
            background-color: #f1f5f9; 
            border-color: #cbd5e1; 
        }

        /* --- TABELAS --- */
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            background-color: var(--white);
            box-shadow: var(--shadow-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background-color: #f8fafc;
            padding: 1.5rem 1.2rem;
            text-align: left;
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 1.4rem 1.2rem;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* --- BADGES --- */
        .badge {
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .badge-garantia { 
            background-color: #dcfce7; 
            color: #15803d; 
            border: 1px solid #bbf7d0; 
        }

        .badge-descarte { 
            background-color: #fee2e2; 
            color: #b91c1c; 
            border: 1px solid #fecaca; 
        }

        /* --- DROPZONE E HINTS --- */
        .dropzone {
            border: 4px dashed #cbd5e1;
            padding: 4rem 2rem;
            text-align: center;
            border-radius: var(--radius-lg);
            background-color: #f8fafc;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-bottom: 2.5rem;
        }

        .dropzone:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
            transform: scale(1.01);
        }

        .csv-hint {
            font-size: 13px;
            color: #475569;
            background-color: #eff6ff;
            padding: 20px;
            border-radius: var(--radius-md);
            margin-bottom: 25px;
            border-left: 6px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 15px;
        }
    </style>
</head>
<body>

<aside>
    <div class="sidebar-header">
        <h2>Metasboard</h2>
    </div>
    <nav>
        <button class="nav-btn active" onclick="switchTab('triagem')">
            <span>🔍</span> Nova Triagem
        </button>
        <button class="nav-btn" onclick="switchTab('dashboard')">
            <span>📊</span> Dashboard / KPIs
        </button>
        <button class="nav-btn" onclick="switchTab('precos')">
            <span>💰</span> Gestão de Preços
        </button>
        <button class="nav-btn" onclick="switchTab('lote')">
            <span>📋</span> Lote em Aberto
        </button>
        <button class="nav-btn" onclick="switchTab('cofre')">
            <span>🔒</span> Cofre de Arquivos
        </button>
    </nav>
</aside>

<main>
    <div class="container">
        
        <div id="triagem" class="tab-content active">
            <div class="card">
                <h3>🔍 Entrada de Mercadoria</h3>
                <div class="dropzone" onclick="document.getElementById('csvMaster').click()">
                    <p id="masterStatus" style="font-size: 1.2rem; color: #64748b;">
                        <strong>📂 Clique aqui para importar o Banco Master de Produtos (CSV)</strong>
                    </p>
                    <input type="file" id="csvMaster" accept=".csv" hidden onchange="importMaster(this)">
                </div>

                <div class="form-row">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>ID do Produto (SKU)</label>
                        <input type="text" id="inpId" placeholder="Digite ou bipe o ID (Ex: 10005)" oninput="previewProd()">
                        <div id="prevName" style="height: 25px; font-size: 13px; color: var(--primary); font-weight: 700; margin-top: 8px;"></div>
                    </div>
                    <div class="form-group">
                        <label>Código de Barras Único</label>
                        <input type="text" id="inpBar" placeholder="Bipe o Barcode da peça">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Fornecedor de Origem</label>
                        <select id="inpSup" onchange="previewProd()">
                            <option value="QUARTT">QUARTT</option>
                            <option value="CNN">CNN</option>
                            <option value="AG">AG</option>
                            <option value="GOLD">GOLD</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Data da Compra</label>
                        <input type="date" id="inpDate">
                    </div>
                    <div class="form-group">
                        <label>Motivo da Triagem</label>
                        <select id="inpReason">
                            <option value="Defeito Técnico">Defeito Técnico</option>
                            <option value="Touch intermitente">Touch intermitente</option>
                            <option value="Tela Trincada">Tela Trincada (Descarte)</option>
                            <option value="Bateria Estufada">Bateria Estufada (Descarte)</option>
                        </select>
                    </div>
                </div>
