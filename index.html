<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metasboard - Gestão de Garantias</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f8fafc;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { color: #1e293b; text-align: center; margin-bottom: 30px; }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input, select, button { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        
        button { cursor: pointer; background: var(--primary); color: white; border: none; font-weight: 600; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-export { background: #475569; margin-top: 10px; }

        .status-badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .status-garantia { background: #dcfce7; color: #166534; }
        .status-descarte { background: #fee2e2; color: #991b1b; }

        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th { background: #f1f5f9; text-align: left; padding: 12px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        
        .filters { display: flex; gap: 10px; margin-bottom: 15px; background: #f1f5f9; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Metasboard | Triagem de Peças</h1>

    <div class="filters">
        <input type="file" id="csvFile" accept=".csv" style="width: 250px;">
        <span style="align-self: center; font-size: 12px; color: #64748b;">(Suba o banco de dados primeiro)</span>
    </div>

    <div class="input-group">
        <input type="text" id="productId" placeholder="ID do Produto (Ex: 10005)">
        <input type="text" id="barcode" placeholder="Código de Barras Único">
        <select id="supplier">
            <option value="">Selecione o Fornecedor</option>
            <option value="QUARTT">QUARTT</option>
            <option value="AG">AG</option>
            <option value="CNN">CNN</option>
            <option value="GOLD">GOLD</option>
            <option value="IMPORTADA">IMPORTADA</option>
        </select>
        <input type="date" id="purchaseDate">
        <select id="reason">
            <option value="">Motivo do Defeito</option>
            <option value="Defeito Técnico">Defeito Técnico</option>
            <option value="Tela Trincada">Tela Trincada (Descarte)</option>
            <option value="Bateria Estufada">Bateria Estufada (Descarte)</option>
        </select>
        <button onclick="processItem()">Adicionar Peça</button>
    </div>

    <div style="display: flex; gap: 10px;">
        <button class="btn-export" onclick="exportData('garantia')">Relatório Garantia (Excel)</button>
        <button class="btn-export" onclick="exportData('descarte')">Relatório Descarte (Excel)</button>
    </div>

    <table id="resultTable">
        <thead>
            <tr>
                <th>Fornecedor</th>
                <th>Produto</th>
                <th>Cód. Barras</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
<script src="app.js"></script>
</body>
</html>
